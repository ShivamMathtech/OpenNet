name: OpenNet tests
on: [push, pull_request]
jobs:
  networking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev python3
      - name: Build and test sockets, routing, recovery and API
        run: bash scripts/test.sh
